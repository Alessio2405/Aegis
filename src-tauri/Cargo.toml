[package]
name = "aegis"
version = "0.1.0"
description = "Aegis — local-first, encrypted AI agent OS"
authors = []
edition = "2021"

[lib]
name = "aegis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aegis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "notification-all",
  "dialog-open",
  "path-all",
  "shell-open",
  "window-close",
  "window-minimize",
  "window-maximize",
  "window-unmaximize",
  "window-unminimize",
  "window-show",
  "window-hide",
  "window-set-title",
  "window-set-resizable",
  "window-set-decorations",
  "window-start-dragging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Crypto
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# Hashing
sha2 = "0.10"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4"] }

# File watching
notify = "6"

# Error handling
thiserror = "1"
anyhow = "1"

# HTTP (Ollama connector + Telegram bot)
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"], default-features = false }

# Discord bot (WebSocket Gateway)
tungstenite = { version = "0.21", features = ["native-tls"] }
native-tls = "0.2"

# WhatsApp bot (embedded webhook HTTP server)
tiny_http = "0.12"

# Desktop automation (keyboard / mouse)
enigo = "0.0"

# PDF generation
printpdf = "0.5"

# PDF text extraction
pdf-extract = "0.7"

[features]
default = ["custom-protocol", "ollama"]
custom-protocol = ["tauri/custom-protocol"]
ollama = []

[profile.release]
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
debug = true
